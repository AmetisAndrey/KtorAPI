<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task API — Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<header>
    <div class="brand">
        <h1>Task&nbsp;API — Dashboard</h1>
        <div class="subtitle">Данные обновляются каждые 5 секунд</div>
    </div>
    <div class="header-right">
            <span class="user-chip" id="userChip" style="display:none;">
                <span class="avatar sm" id="userAvatar"></span>
                <strong id="userName"></strong>
            </span>
        <button class="icon-btn" id="themeToggle" title="Сменить тему" onclick="toggleTheme()">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
        <button class="icon-btn" title="Выйти" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </div>
</header>

<!-- Метрики -->
<section class="stats">
    <div class="stat">
        <div class="stat-icon total">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <div class="stat-body"><div class="stat-value" id="statTotal">—</div><div class="stat-label">Всего задач</div></div>
    </div>
    <div class="stat">
        <div class="stat-icon done">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="stat-body"><div class="stat-value" id="statDone">—</div><div class="stat-label">Выполнено</div></div>
    </div>
    <div class="stat">
        <div class="stat-icon todo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="stat-body"><div class="stat-value" id="statTodo">—</div><div class="stat-label">В работе</div></div>
    </div>
    <div class="stat">
        <div class="stat-icon pct">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
        </div>
        <div class="stat-body"><div class="stat-value" id="statPct">—</div><div class="stat-label">Прогресс</div></div>
    </div>
</section>

<!-- Графики -->
<section class="grid">
    <div class="card">
        <div class="card-header"><h2>Выполнено / В работе</h2></div>
        <canvas id="chartStatus"></canvas>
    </div>
    <div class="card">
        <div class="card-header"><h2>Длина названий</h2></div>
        <canvas id="chartLength"></canvas>
    </div>
    <div class="card">
        <div class="card-header"><h2>Динамика по id</h2></div>
        <canvas id="chartProgress"></canvas>
    </div>
</section>

<!-- Задачи -->
<section class="card">
    <div class="card-header">
        <h2>Задачи</h2>
        <div class="header-actions">
            <button class="secondary" onclick="loadTasks()" title="Перезагрузить">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                Обновить
            </button>
            <button class="secondary" onclick="exportData('csv')" title="Скачать CSV">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                CSV
            </button>
            <button class="secondary" onclick="exportData('json')" title="Скачать JSON">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                JSON
            </button>
        </div>
    </div>

    <div class="toolbar create-form">
        <input id="newTitle" placeholder="Название новой задачи">
        <input id="newDescription" placeholder="Описание (необязательно)">
        <button onclick="createTask()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Создать
        </button>
    </div>

    <div class="toolbar">
        <input id="searchInput" class="search-input" placeholder="Поиск по названию или описанию…" oninput="onFilterChange()">
        <select id="filterStatus" onchange="onFilterChange()">
            <option value="all">Все статусы</option>
            <option value="todo">Только в работе</option>
            <option value="done">Только выполненные</option>
        </select>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th class="sortable" data-sort="id" onclick="onSortClick('id')">id <span class="sort-indicator">↕</span></th>
                <th class="sortable" data-sort="title" style="width:22%;" onclick="onSortClick('title')">Название <span class="sort-indicator">↕</span></th>
                <th class="sortable" data-sort="description" onclick="onSortClick('description')">Описание <span class="sort-indicator">↕</span></th>
                <th class="sortable" data-sort="completed" style="width:130px;" onclick="onSortClick('completed')">Статус <span class="sort-indicator">↕</span></th>
                <th style="width: 320px;">Действия</th>
            </tr>
            </thead>
            <tbody id="taskBody">
            <tr><td colspan="5"><div class="skeleton" style="height:16px; margin: 6px 0;"></div></td></tr>
            <tr><td colspan="5"><div class="skeleton" style="height:16px; margin: 6px 0;"></div></td></tr>
            <tr><td colspan="5"><div class="skeleton" style="height:16px; margin: 6px 0;"></div></td></tr>
            </tbody>
        </table>
    </div>
    <div id="emptyState" class="empty" style="display:none;">
        <div>Задач по текущим условиям не найдено</div>
    </div>

    <!-- Пагинация -->
    <div class="pagination" id="pagination">
        <div class="info" id="pageInfo">—</div>
        <div class="page-size">
            <span>На странице:</span>
            <select id="pageSize" onchange="onPageSizeChange()">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="0">Все</option>
            </select>
        </div>
        <div class="controls" id="pageControls"></div>
    </div>
</section>

<!-- Модальное окно -->
<div class="modal-backdrop" id="editModal">
    <div class="modal">
        <h3>Редактировать задачу</h3>
        <label for="editTitle">Название</label>
        <input id="editTitle" maxlength="200">
        <label for="editDescription">Описание</label>
        <textarea id="editDescription" maxlength="2000"></textarea>
        <div class="modal-actions">
            <button class="secondary" onclick="closeEditModal()">Отмена</button>
            <button onclick="saveEdit()">Сохранить</button>
        </div>
    </div>
</div>

<div class="toast-stack" id="toasts"></div>

<script src="/js/shared.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
